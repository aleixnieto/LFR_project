# Fixed-test comparison for the all-unique principal and matched-control reruns.
image_dir: ../../../RSICD_images
json_path: ../../../dataset_rsicd.json
dataset_split: test
class_dir: ../../../txtclasses_rsicd

models:
  - label: baseline
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: openclip
    checkpoint_path: ../../../weights/open_clip/ViT-B-32-laion2b_s34b_b79k.bin

  - label: supervised_all_unique_control_best
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: finetune
    checkpoint_path: ../../../results/open_clip_supervised_all_unique_control_paper_1gpu_seed42_functionality_rerun/ckp_best.pth

  - label: supervised_all_unique_control_final
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: finetune
    checkpoint_path: ../../../results/open_clip_supervised_all_unique_control_paper_1gpu_seed42_functionality_rerun/ckp_last.pth

  - label: semiclip_all_unique_stage1_final
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: finetune
    checkpoint_path: ../../../results/open_clip_semiclip_paper_1gpu_all_unique_seed42_functionality_rerun/stage1_final.pt

  - label: semiclip_all_unique_stage2_final
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: finetune
    checkpoint_path: ../../../results/open_clip_semiclip_paper_1gpu_all_unique_seed42_functionality_rerun/stage2_final.pt
