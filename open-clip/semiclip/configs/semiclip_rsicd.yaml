# Local OpenCLIP initialization. Paths resolve relative to this file.
model_name: ViT-B-32
pretrained_tag: laion2b_s34b_b79k
checkpoint_path: ../../../weights/open_clip/ViT-B-32-laion2b_s34b_b79k.bin

# RSICD split isolation: test is evaluation-only.
image_dir: ../../../RSICD_images
json_path: ../../../dataset_rsicd.json
labeled_split: val
unlabeled_split: train
supervised_train_fraction: 0.8
seed: 42
caption_policy: random_one

# Released SemiCLIP training recipe, split equally across labeled/unlabeled data.
total_batch_size: 64
num_workers: 4
learning_rate: 0.00005
weight_decay: 0.2
beta1: 0.9
beta2: 0.98
epsilon: 0.000001
warmup_steps: 10
stage1_epochs: 25
stage2_epochs: 15

# Observable defaults from the released implementation.
concept_min_frequency: 5
concept_max_frequency_ratio: 0.3
concept_loss_top_k: 3
surrogate_top_k: 4
selection_ratio: 0.3
clip_loss_weight: 1.0
concept_loss_weight: 1.0
intramodal_loss_weight: 1.0
crossmodal_loss_weight: 1.0

output_dir: ../../../results/open_clip_semiclip
