# Supervised OpenCLIP test-set image-to-text retrieval; final reporting only.
image_dir: ../../../RSICD_images
json_path: ../../../dataset_rsicd.json
dataset_split: test
class_dir: ../../../txtclasses_rsicd
ks: [1, 3, 5, 10]
num_captions: 10
log_every: 100
models:
  - label: sup1
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: finetune
    checkpoint_path: ../../../results/sup-deterministic-multi-seed/random_one_seed42/ckp_best.pth
  - label: supAll
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: finetune
    checkpoint_path: ../../../results/sup-deterministic-multi-seed/all_unique_seed42/ckp_best.pth
