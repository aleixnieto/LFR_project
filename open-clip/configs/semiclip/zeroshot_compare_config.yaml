# Compare the original, supervised, and SemiCLIP models on untouched RSICD test images.
# Paths are relative to this configuration file.
image_dir: ../../../RSICD_images
json_path: ../../../dataset_rsicd.json
dataset_split: test
class_dir: ../../../txtclasses_rsicd

models:
  - label: baseline
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: openclip
    checkpoint_path: ../../../weights/open_clip/ViT-B-32-laion2b_s34b_b79k.bin

  - label: supervised
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: finetune
    checkpoint_path: ../../../results/open_clip_finetune/ckp_best.pth

  - label: semiclip
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: finetune
    checkpoint_path: ../../../results/open_clip_semiclip/stage2_final.pt
