# Local OpenCLIP initialization. Relative paths resolve from this file.
model_name: ViT-B-32
pretrained_tag: laion2b_s34b_b79k
checkpoint_path: ../../weights/open_clip/ViT-B-32-laion2b_s34b_b79k.bin

# Captioned RSICD data for the supervised baseline.
# Uses the val split (according to assignment instructions) in dataset_rsicd.json (the captioned source subset)
image_dir: ../../RSICD_images 
json_path: ../../dataset_rsicd.json
dataset_split: val
seed: 42
supervised_train_fraction: 0.8 # remaining 20% for validation
caption_policy: all_unique
text_to_image_weighting: per_caption

# Training recipe selected by the full matrix ablation.
batch_size: 16
num_workers: 4
epochs: 8
learning_rate: 0.00003
optimizer: adamw
weight_decay: 0.1
warmup_fraction: 0.1
output_dir: ../../results/open_clip_finetune
