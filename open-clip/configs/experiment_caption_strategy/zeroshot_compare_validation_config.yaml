# Parameter selection only: compare caption strategies on the exact seed-42
# held-out partition of the RSICD val split. Use this config with
# main_zeroshot_compare_config_subset.py, never with the full-split evaluator.
image_dir: ../../../RSICD_images
json_path: ../../../dataset_rsicd.json
dataset_split: val
class_dir: ../../../txtclasses_rsicd
subset_filenames_json: ../../../results/open_clip_semiclip_paper_1gpu_seed42/concepts.json
subset_filenames_key: labeled_validation_filenames

models:
  - label: non_finetuned_baseline
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: openclip
    checkpoint_path: ../../../weights/open_clip/ViT-B-32-laion2b_s34b_b79k.bin

  - label: all_unique_per_caption
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: finetune
    checkpoint_path: ../../../results/experiment_caption_strategy_2/open_clip_finetune_all_unique_per_caption/ckp_best.pth

  - label: random_one_per_caption
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: finetune
    checkpoint_path: ../../../results/experiment_caption_strategy_2/open_clip_finetune_random_one_per_caption/ckp_best.pth

  - label: all_unique_per_image
    model_name: ViT-B-32
    pretrained_tag: laion2b_s34b_b79k
    checkpoint_type: finetune
    checkpoint_path: ../../../results/experiment_caption_strategy_2/open_clip_finetune_all_unique_per_image/ckp_best.pth
